<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryoFinance Pro v11.0.0</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #00a859; --dark: #0f2419; --danger: #ef4444; --border: #e2e8f0; --bg: #f8fafc; --sidebar-w: 250px; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }
        
        /* Sidebar */
        aside { width: var(--sidebar-w); background: var(--dark); color: white; display: flex; flex-direction: column; z-index: 1000; }
        .brand { padding: 20px; font-weight: 800; color: var(--primary); border-bottom: 1px solid #1d402f; text-align: center; }
        nav { flex: 1; padding: 10px 0; }
        .menu-item { width: 100%; padding: 15px 20px; background: none; border: none; color: #94a3b8; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
        .menu-item:hover, .menu-item.active { background: #163022; color: white; }
        .menu-item.active { border-left: 4px solid var(--primary); }

        /* Main Content */
        main { flex: 1; overflow-y: auto; padding: 20px; }
        .view { display: none; animation: fadeIn 0.3s; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; align-items: end; }
        
        /* Tables */
        .table-wrap { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f1f5f9; text-align: left; padding: 12px; color: #64748b; text-transform: uppercase; font-size: 11px; }
        td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
        
        /* Inputs & Buttons */
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; outline: none; }
        .btn { padding: 10px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: white; border: 1px solid var(--border); }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .bg-rec { background: #dcfce7; color: #166534; }
        .bg-cus { background: #fee2e2; color: #991b1b; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside { width: 100%; height: auto; position: relative; }
            .menu-item { padding: 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

<aside>
    <div class="brand">CRYO FINANCE</div>
    <nav>
        <button class="menu-item active" onclick="switchView('v-dash', this)"><i class="fas fa-chart-pie"></i> Dashboard</button>
        <button class="menu-item" onclick="switchView('v-plano', this)"><i class="fas fa-list"></i> Plano de Contas</button>
        <button class="menu-item" onclick="switchView('v-lan', this)"><i class="fas fa-plus-circle"></i> Lançamentos</button>
        <button class="menu-item" onclick="switchView('v-dre', this)"><i class="fas fa-file-contract"></i> DRE</button>
    </nav>
</aside>

<main>
    <!-- DASHBOARD -->
    <section id="v-dash" class="view active">
        <div class="card">
            <div class="grid">
                <div><label>Início</label><input type="date" id="d-ini"></div>
                <div><label>Fim</label><input type="date" id="d-fim"></div>
                <button class="btn btn-primary" onclick="loadDashboard()">Atualizar</button>
            </div>
        </div>
        <div class="grid" id="dash-summary"></div>
        <div class="card"><canvas id="mainChart" height="100"></canvas></div>
    </section>

    <!-- PLANO DE CONTAS -->
    <section id="v-plano" class="view">
        <div style="display:flex; justify-content: space-between; margin-bottom: 15px;">
            <h2>Estrutura de Contas</h2>
            <button class="btn btn-primary" onclick="seedFullAccountPlan()"><i class="fas fa-upload"></i> Importar Plano Completo</button>
        </div>
        <div class="card">
            <form class="grid" onsubmit="event.preventDefault(); addAccount();">
                <input type="text" id="acc-code" placeholder="Código (Ex: 3.1.1.01)" required>
                <input type="text" id="acc-desc" placeholder="Descrição" required>
                <select id="acc-nature">
                    <option value="recebimento">Receita</option>
                    <option value="custo">Custo/Despesa</option>
                    <option value="ativo">Ativo/Patrimônio</option>
                </select>
                <button class="btn btn-primary">Adicionar</button>
            </form>
        </div>
        <div class="card table-wrap">
            <table>
                <thead><tr><th>CÓDIGO</th><th>DESCRIÇÃO</th><th>NATUREZA</th><th>AÇÃO</th></tr></thead>
                <tbody id="acc-table-body"></tbody>
            </table>
        </div>
    </section>

    <!-- LANÇAMENTOS -->
    <section id="v-lan" class="view">
        <h2>Novo Lançamento</h2>
        <div class="card">
            <form class="grid" onsubmit="event.preventDefault(); addTransaction();">
                <input type="date" id="t-date" required>
                <select id="t-unit"><option>Santos</option><option>Camaçari</option></select>
                <select id="t-acc" required></select>
                <input type="text" id="t-desc" placeholder="Histórico/Descrição" required>
                <input type="number" step="0.01" id="t-val" placeholder="Valor R$" required>
                <button class="btn btn-primary">Salvar</button>
            </form>
        </div>
        <div class="card table-wrap">
            <table>
                <thead><tr><th>DATA</th><th>UNIDADE</th><th>CONTA</th><th>HISTÓRICO</th><th>VALOR</th></tr></thead>
                <tbody id="trans-table-body"></tbody>
            </table>
        </div>
    </section>

    <!-- DRE -->
    <section id="v-dre" class="view">
        <h2>DRE Consolidado</h2>
        <div class="card table-wrap">
            <table id="dre-table">
                <thead><tr><th>DESCRIÇÃO</th><th style="text-align:right">VALOR (R$)</th></tr></thead>
                <tbody id="dre-body"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
    const { Client, Databases, ID, Query } = Appwrite;
    const client = new Client().setEndpoint('https://nyc.cloud.appwrite.io/v1').setProject('69f35a44003278bff900');
    const databases = new Databases(client);
    const DB_ID = '69f35a670029fa96fd5f', COLL_ACC = 'accounts', COLL_TRANS = 'transactions';

    let accounts = [], transactions = [], myChart = null;

    async function init() {
        setDefaultDates();
        await loadAccounts();
        await loadTransactions();
        loadDashboard();
    }

    function switchView(id, btn) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    async function loadAccounts() {
        try {
            const res = await databases.listDocuments(DB_ID, COLL_ACC, [Query.limit(500), Query.orderAsc('code')]);
            accounts = res.documents;
            renderAccounts();
            populateSelects();
        } catch (e) { console.error("Erro ao carregar contas", e); }
    }

    function renderAccounts() {
        const body = document.getElementById('acc-table-body');
        body.innerHTML = accounts.map(a => `
            <tr>
                <td><b>${a.code}</b></td>
                <td>${a.description}</td>
                <td><span class="badge ${a.nature === 'recebimento' ? 'bg-rec' : 'bg-cus'}">${a.nature}</span></td>
                <td><button onclick="deleteDoc('${COLL_ACC}','${a.$id}')" class="btn btn-outline" style="color:red">X</button></td>
            </tr>
        `).join('');
    }

    function populateSelects() {
        const sel = document.getElementById('t-acc');
        sel.innerHTML = accounts.map(a => `<option value="${a.code}">${a.code} - ${a.description}</option>`).join('');
    }

    async function addAccount() {
        const data = {
            code: document.getElementById('acc-code').value,
            description: document.getElementById('acc-desc').value,
            nature: document.getElementById('acc-nature').value
        };
        await databases.createDocument(DB_ID, COLL_ACC, ID.unique(), data);
        alert("Conta adicionada!");
        loadAccounts();
    }

    async function addTransaction() {
        const data = {
            date: document.getElementById('t-date').value,
            unit: document.getElementById('t-unit').value,
            account_id: document.getElementById('t-acc').value,
            description: document.getElementById('t-desc').value,
            amount: parseFloat(document.getElementById('t-val').value)
        };
        await databases.createDocument(DB_ID, COLL_TRANS, ID.unique(), data);
        alert("Lançamento salvo!");
        loadTransactions();
    }

    async function loadTransactions() {
        const res = await databases.listDocuments(DB_ID, COLL_TRANS, [Query.limit(100), Query.orderDesc('date')]);
        transactions = res.documents;
        const body = document.getElementById('trans-table-body');
        body.innerHTML = transactions.map(t => `
            <tr>
                <td>${t.date.split('-').reverse().join('/')}</td>
                <td>${t.unit}</td>
                <td>${t.account_id}</td>
                <td>${t.description}</td>
                <td style="color:${getNature(t.account_id) === 'recebimento' ? 'green' : 'red'}">R$ ${t.amount.toLocaleString()}</td>
            </tr>
        `).join('');
    }

    function getNature(code) {
        const acc = accounts.find(a => a.code === code);
        return acc ? acc.nature : 'custo';
    }

    function loadDashboard() {
        let rec = 0, cus = 0;
        transactions.forEach(t => {
            const n = getNature(t.account_id);
            if(n === 'recebimento') rec += t.amount;
            else if(n === 'custo') cus += t.amount;
        });

        document.getElementById('dash-summary').innerHTML = `
            <div class="card" style="border-left: 5px solid green">Receitas: <br><b>R$ ${rec.toLocaleString()}</b></div>
            <div class="card" style="border-left: 5px solid red">Despesas: <br><b>R$ ${cus.toLocaleString()}</b></div>
            <div class="card" style="border-left: 5px solid black">Saldo: <br><b>R$ ${(rec - cus).toLocaleString()}</b></div>
        `;
        renderChart(rec, cus);
        renderDRE(rec, cus);
    }

    function renderDRE(rec, cus) {
        const body = document.getElementById('dre-body');
        body.innerHTML = `
            <tr><td><b>1. RECEITA BRUTA</b></td><td align="right"><b>R$ ${rec.toLocaleString()}</b></td></tr>
            <tr><td>2. CUSTOS E DESPESAS</td><td align="right" style="color:red">R$ ${cus.toLocaleString()}</td></tr>
            <tr style="background:#eee"><td><b>3. RESULTADO LÍQUIDO</b></td><td align="right"><b>R$ ${(rec-cus).toLocaleString()}</b></td></tr>
        `;
    }

    function renderChart(r, c) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['Receitas', 'Custos'], datasets: [{ data: [r, c], backgroundColor: ['#22c55e', '#ef4444'] }] },
            options: { plugins: { legend: { display: false } } }
        });
    }

    async function seedFullAccountPlan() {
        if(!confirm("Deseja carregar o plano completo agora?")) return;
        
        const plano = [
            {c: "1.1.1.01", d: "Caixa Geral Cartão", n: "ativo"},
            {c: "1.1.2.01", d: "Valor Recebido Mechatronics", n: "recebimento"},
            {c: "1.1.2.02", d: "Valor Recebido Camaçari", n: "recebimento"},
            {c: "3.1.1.03", d: "Venda de Serviços (Frotas)", n: "recebimento"},
            {c: "3.2.1.01", d: "Custos dos Insumos", n: "custo"},
            {c: "3.2.2.01", d: "Despesas Administrativas", n: "custo"},
            {c: "2.1.4.01", d: "Salários a Pagar", n: "custo"}
            // Adicione aqui as demais contas do seu texto seguindo este padrão
        ];

        for(let item of plano) {
            try {
                await databases.createDocument(DB_ID, COLL_ACC, ID.unique(), { code: item.c, description: item.d, nature: item.n });
            } catch(e) { console.log("Pulando existente..."); }
        }
        alert("Plano base carregado! Adicione as demais contas conforme necessário.");
        loadAccounts();
    }

    async function deleteDoc(coll, id) { if(confirm("Excluir?")) { await databases.deleteDocument(DB_ID, coll, id); init(); } }
    function setDefaultDates() { const now = new Date().toISOString().split('T')[0]; document.querySelectorAll('input[type="date"]').forEach(i => i.value = now); }

    window.onload = init;
</script>
</body>
</html>
