            border: none;

            outline: none;

        .filter-box {

            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 42px;
        }
        .filter-options {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            z-index: 1000;
            max-height: 260px;
            overflow-y: auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin-top: 5px;

        .opt label { margin: 0; font-weight: normal; text-transform: none; cursor: pointer; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 14px 12px; background: #f8fafc; color: #64748b; font-size: 11px; font-weight: 700; border-bottom: 2px solid var(--border); text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        .btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;

        .btn-primary { background: var(--primary); color: white; }
        .btn-ghost { background: transparent; color: #475569; }

        .badge {

<aside>
    <div class="brand">CRYO</div>

        <button class="menu-item active" onclick="showView('dashboard', this)"><i class="fas fa-chart-line"></i><span>Dashboard</span></button>

</aside>

<main>
    <!-- DASHBOARD -->
    <section id="dashboard" class="view-section active">
        <div class="card">
            <div class="grid-header">
                <div><label>Unidade</label><select id="dash-uni"><option value="Todas">Todas</option><option value="Santos">Santos</option><option value="Camaçari">Camaçari</option></select></div>
                <div class="excel-filter">
                    <label>Filtro de Contas</label>
                    <div class="filter-box" onclick="toggleDropdown('dash-opt')"><span id="dash-sel-txt">Todas</span><i class="fas fa-chevron-down"></i></div>
                    <div id="dash-opt" class="filter-options"><div class="opt"><b><input type="checkbox" id="dash-all" checked onchange="toggleAll('dash')"> Selecionar Todas</b></div><div id="dash-list"></div></div>
                </div>
                <div><label>Início</label><input type="date" id="dash-ini"></div><div><label>Fim</label><input type="date" id="dash-fim"></div>
                <button class="btn btn-primary" onclick="processarDashboard()"><i class="fas fa-sync"></i> Atualizar</button>
            </div>
        </div>
        <div id="dash-cards" class="dash-grid"></div>
        <div class="card"><h3>Visão Consolidada</h3><canvas id="chartGeral" height="100"></canvas></div>
        <div class="card"><h4>Resultado por Unidade</h4><canvas id="chartUnidades" height="150"></canvas></div>
    </section>

    <!-- PLANO DE CONTAS -->
    <section id="plano" class="view-section">
        <div class="card">
            <form id="formPlano" class="grid-header" onsubmit="event.preventDefault(); criarPlano();">
                <input type="text" id="p-codigo" placeholder="Código (Ex: 3.1.1.01)" required>
                <input type="text" id="p-desc" placeholder="Descrição da Conta" required>
                <input type="text" id="p-estoque" placeholder="Descrição Estoque (opcional)">
                <select id="p-natureza">
                    <option value="recebimento">Recebimento (+)</option><option value="custo">Custo (-)</option>
                    <option value="estoque">Estoque (Custo)</option><option value="ativo">Ativo</option>
                </select>
                <button type="submit" class="btn btn-primary">Adicionar Conta</button>
            </form>
        </div>
        <div class="card"><div class="table-responsive"><table><thead><tr><th>CÓDIGO</th><th>DESCRIÇÃO</th><th>ESTOQUE</th><th>NATUREZA</th><th>AÇÕES</th></tr></thead><tbody id="p-corpo"></tbody></table></div></div>
    </section>

    <!-- LANÇAMENTOS -->
    <section id="lancamentos" class="view-section">
        <div class="card">
            <form id="formLan" class="grid-header" onsubmit="event.preventDefault(); criarLan();">
                <input type="date" id="l-data" required>
                <select id="l-uni"><option value="Santos">Santos</option><option value="Camaçari">Camaçari</option></select>
                <select id="l-conta" required></select>
                <input type="text" id="l-desc" placeholder="Histórico / Referência" required>
                <input type="number" step="0.01" id="l-valor" placeholder="R$ 0,00" required>
                <button type="submit" class="btn btn-primary">Salvar Lançamento</button>
            </form>
        </div>
        <div class="card"><div class="table-responsive"><table><thead><tr><th>DATA</th><th>UNIDADE</th><th>CONTA</th><th>TIPO</th><th>HISTÓRICO</th><th>VALOR</th><th>AÇÕES</th></tr></thead><tbody id="l-corpo"></tbody></table></div></div>
    </section>

    <!-- DRE -->
    <section id="dre" class="view-section">
        <div class="card">
            <div class="grid-header">
                <div><label>Unidade</label><select id="dre-uni"><option value="Todas">Todas</option><option value="Santos">Santos</option><option value="Camaçari">Camaçari</option></select></div>
                <div class="excel-filter"><label>Filtro Contas DRE</label><div class="filter-box" onclick="toggleDropdown('dre-opt')"><span id="dre-sel-txt">Todas</span><i class="fas fa-chevron-down"></i></div><div id="dre-opt" class="filter-options"><div class="opt"><b><input type="checkbox" id="dre-all" checked onchange="toggleAll('dre')"> Selecionar Todas</b></div><div id="dre-list"></div></div></div>
                <div><label>Início</label><input type="date" id="dre-ini"></div><div><label>Fim</label><input type="date" id="dre-fim"></div>
                <button class="btn btn-primary" onclick="gerarDRE()"><i class="fas fa-chart-pie"></i> Gerar DRE</button>
            </div>
        </div>
        <div class="card"><div class="table-responsive"><table id="dre-table"><thead><tr><th>ESTRUTURA DRE</th><th>VALOR (R$)</th></tr></thead><tbody id="dre-corpo"></tbody></table></div></div>
        <div class="card"><canvas id="chartDRE" height="200"></canvas></div>
    </section>
</main>

        { code: "3.2.1.05", description: "Baixas de Estoque", nature: "custo" },

        { code: "3.2.2.02", description: "Despesas com Viagens", nature: "custo" },
        { code: "3.2.2.03", description: "Despesas com honorários contabilidade", nature: "custo" },
        { code: "3.2.2.04", description: "Despesas com correios", nature: "custo" },
        { code: "3.2.2.05", description: "Despesas com frete", nature: "custo" },
        { code: "3.2.2.06", description: "Outras Despesas Gerais Incluindo propaganda)", nature: "custo" },

        { code: "3.2.4", description: "Outras Despesas Operacionais (baixas do capital social)", nature: "custo" },

        { code: "3.2.4.03", description: "Outras Despesas", nature: "custo" }
    ];

    async function seedPlanoContas() {
        try {
            const existing = await databases.listDocuments(DB_ID, COLL_ACC, [Query.limit(1)]);
            if(existing.total > 0) return;
            for(const conta of contasPadrao) {
                await databases.createDocument(DB_ID, COLL_ACC, ID.unique(), {
                    code: conta.code,
                    description: conta.description,
                    stock_desc: "",
                    nature: conta.nature
                });
            }
            showToast("Plano de contas padrão carregado com sucesso!");
        } catch(e) { console.error("Seed falhou", e); }
    }

    // -------------------- FUNÇÕES PRINCIPAIS --------------------
    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.style.background = isError ? '#b91c1c' : '#0f2419';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function setDatasPadrao() {
        const hoje = new Date().toISOString().split('T')[0];
        const primeiroDia = hoje.substring(0,8)+'01';
        document.getElementById('dash-ini').value = primeiroDia;
        document.getElementById('dash-fim').value = hoje;
        document.getElementById('dre-ini').value = primeiroDia;
        document.getElementById('dre-fim').value = hoje;
        document.getElementById('l-data').value = hoje;
    }

    function toggleDropdown(id) { document.getElementById(id)?.classList.toggle('show'); }
    function toggleAll(prefix) {
        const allChk = document.getElementById(`${prefix}-all`);
        if(allChk) {
            document.querySelectorAll(`.${prefix}-ck`).forEach(cb => cb.checked = allChk.checked);
            updateTxt(prefix);
        }
    }
    function updateTxt(prefix) {
        const cbs = document.querySelectorAll(`.${prefix}-ck`);
        const chkCount = Array.from(cbs).filter(cb => cb.checked).length;
        const total = cbs.length;
        document.getElementById(`${prefix}-sel-txt`).innerText = chkCount === total ? "Todas" : `${chkCount} selecionada(s)`;
    }

    async function carregarContas() {
        try {
            const res = await databases.listDocuments(DB_ID, COLL_ACC, [Query.limit(500), Query.orderAsc('code')]);
            cacheAcc = {};
            const lConta = document.getElementById('l-conta');
            const pCorpo = document.getElementById('p-corpo');
            const dashList = document.getElementById('dash-list');
            const dreList = document.getElementById('dre-list');
            if(lConta) lConta.innerHTML = '<option value="">-- Selecione --</option>';
            pCorpo.innerHTML = '';
            dashList.innerHTML = '';
            dreList.innerHTML = '';

            for(const doc of res.documents) {
                cacheAcc[doc.code] = { ...doc, nature: doc.nature };
                if(lConta) lConta.innerHTML += `<option value="${doc.code}">${doc.code} - ${doc.description}</option>`;
                const optDash = `<div class="opt"><input type="checkbox" class="dash-ck" value="${doc.code}" checked onchange="updateTxt('dash')"> <label>${doc.code} - ${escapeHtml(doc.description)}</label></div>`;
                const optDre = `<div class="opt"><input type="checkbox" class="dre-ck" value="${doc.code}" checked onchange="updateTxt('dre')"> <label>${doc.code} - ${escapeHtml(doc.description)}</label></div>`;
                dashList.innerHTML += optDash;
                dreList.innerHTML += optDre;
                pCorpo.innerHTML += `<tr id="row-p-${doc.$id}">
                    <td>${escapeHtml(doc.code)}</td><td>${escapeHtml(doc.description)}</td><td>${escapeHtml(doc.stock_desc || '')}</td>
                    <td>${doc.nature}</td>
                    <td><button class="btn btn-ghost" onclick="ativarEdicaoPlano('${doc.$id}')"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-ghost" style="color:var(--danger)" onclick="excluirConta('${doc.$id}','${doc.code}')"><i class="fas fa-trash"></i></button></td>
                </tr>`;
            }
            updateTxt('dash');
            updateTxt('dre');
            if(res.total === 0) await seedPlanoContas().then(() => carregarContas());
        } catch(e) { showToast("Erro ao carregar contas", true); }
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    async function criarPlano() {
        const code = document.getElementById('p-codigo').value.trim();
        const desc = document.getElementById('p-desc').value.trim();
        const stock = document.getElementById('p-estoque').value.trim();
        const nature = document.getElementById('p-natureza').value;
        if(!code || !desc) { showToast("Código e descrição são obrigatórios", true); return; }
        await databases.createDocument(DB_ID, COLL_ACC, ID.unique(), { code, description: desc, stock_desc: stock, nature });
        showToast("Conta criada");
        document.getElementById('formPlano').reset();
        await carregarContas();
    }

    async function excluirConta(id, code) {
        const exists = await databases.listDocuments(DB_ID, COLL_MOV, [Query.equal('cat', code), Query.limit(1)]);
        if(exists.total > 0) { showToast("Conta possui lançamentos, não pode ser excluída", true); return; }
        if(confirm("Excluir permanentemente?")) {
            await databases.deleteDocument(DB_ID, COLL_ACC, id);
            await carregarContas();
            showToast("Conta removida");
        }
    }

    function ativarEdicaoPlano(id) { /* inline edit igual anterior, omitido por brevidade mas funcional */ 
        const row = document.getElementById(`row-p-${id}`);
        const code = row.cells[0].innerText, desc = row.cells[1].innerText, stock = row.cells[2].innerText, nature = row.cells[3].innerText;
        row.classList.add('row-editing');
        row.innerHTML = `<td><input id="ed-p-c-${id}" value="${code}"></td><td><input id="ed-p-d-${id}" value="${desc}"></td>
        <td><input id="ed-p-s-${id}" value="${stock}"></td>
        <td><select id="ed-p-n-${id}"><option value="recebimento" ${nature=='recebimento'?'selected':''}>Recebimento</option><option value="custo" ${nature=='custo'?'selected':''}>Custo</option><option value="estoque" ${nature=='estoque'?'selected':''}>Estoque</option><option value="ativo" ${nature=='ativo'?'selected':''}>Ativo</option></select></td>
        <td><button class="btn btn-primary" onclick="salvarEdicaoPlano('${id}')">✔</button></td>`;
    }
    async function salvarEdicaoPlano(id) {
        const newCode = document.getElementById(`ed-p-c-${id}`).value;
        const newDesc = document.getElementById(`ed-p-d-${id}`).value;
        const newStock = document.getElementById(`ed-p-s-${id}`).value;
        const newNature = document.getElementById(`ed-p-n-${id}`).value;
        await databases.updateDocument(DB_ID, COLL_ACC, id, { code: newCode, description: newDesc, stock_desc: newStock, nature: newNature });
        await carregarContas();
        showToast("Conta atualizada");
    }

    // LANÇAMENTOS (CREATE, READ, UPDATE, DELETE)
    async function criarLan() {
        const data = document.getElementById('l-data').value;
        const unidade = document.getElementById('l-uni').value;
        const contaCode = document.getElementById('l-conta').value;
        const desc = document.getElementById('l-desc').value.trim();
        let valor = parseFloat(document.getElementById('l-valor').value);
        if(!data || !contaCode || !desc || isNaN(valor) || valor <= 0) { showToast("Preencha todos os campos corretamente", true); return; }
        const account = cacheAcc[contaCode];
        if(!account) { showToast("Conta inválida", true); return; }
        const docMov = {
            data, desc, tipo: account.nature, cat: account.code, nomecat: account.description,
            cod: account.code, descricao: desc, contaDebito: (account.nature === 'recebimento') ? account.code : '',
            contaCredito: (account.nature === 'custo') ? account.code : '', valor, unidade
        };
        await databases.createDocument(DB_ID, COLL_MOV, ID.unique(), docMov);
        showToast("Lançamento salvo!");
        document.getElementById('formLan').reset(); setDatasPadrao();
        await renderLanTable(); processarDashboard();
    }

    async function renderLanTable() {
        const res = await databases.listDocuments(DB_ID, COLL_MOV, [Query.orderDesc('data'), Query.limit(200)]);
        const tbody = document.getElementById('l-corpo');
        tbody.innerHTML = '';
        for(const doc of res.documents) {
            const acc = cacheAcc[doc.cat] || { nature: doc.tipo };
            const badgeClass = acc.nature === 'recebimento' ? 'badge-rec' : (acc.nature === 'custo' || acc.nature === 'estoque') ? 'badge-cus' : 'badge-ati';
            tbody.innerHTML += `<tr id="row-l-${doc.$id}">
                <td>${doc.data.split('-').reverse().join('/')}</td><td>${escapeHtml(doc.unidade)}</td><td>${escapeHtml(doc.cat)}</td>
                <td><span class="badge ${badgeClass}">${acc.nature}</span></td><td>${escapeHtml(doc.desc)}</td>
                <td>R$ ${doc.valor.toLocaleString('pt-BR')}</td>
                <td><button class="btn btn-ghost" onclick="ativarEdicaoLan('${doc.$id}')"><i class="fas fa-edit"></i></button>
                <button class="btn btn-ghost" style="color:var(--danger)" onclick="excluirLan('${doc.$id}')"><i class="fas fa-trash"></i></button></td>
            </tr>`;
        }
    }
    async function excluirLan(id) { if(confirm("Excluir?")) { await databases.deleteDocument(DB_ID, COLL_MOV, id); await renderLanTable(); processarDashboard(); showToast("Excluído"); } }
    function ativarEdicaoLan(id) { /* simplificado, mas funcional */ 
        const row = document.getElementById(`row-l-${id}`);
        const data = row.cells[0].innerText.split('/').reverse().join('-');
        const unidade = row.cells[1].innerText;
        const hist = row.cells[4].innerText;
        const valor = row.cells[5].innerText.replace('R$ ','').replace(/\./g,'').replace(',','.');
        row.classList.add('row-editing');
        row.innerHTML = `<td colspan="7"><div style="display:flex; gap:8px; flex-wrap:wrap;"><input type="date" id="ed-l-dat-${id}" value="${data}"><select id="ed-l-uni-${id}"><option value="Santos" ${unidade=='Santos'?'selected':''}>Santos</option><option value="Camaçari" ${unidade=='Camaçari'?'selected':''}>Camaçari</option></select><input id="ed-l-his-${id}" value="${hist}"><input type="number" step="0.01" id="ed-l-val-${id}" value="${parseFloat(valor)}"><button class="btn btn-primary" onclick="salvarEdicaoLan('${id}')">✔</button><button class="btn btn-ghost" onclick="renderLanTable()">✖</button></div></td>`;
    }
    async function salvarEdicaoLan(id) {
        const newData = document.getElementById(`ed-l-dat-${id}`).value;
        const newUni = document.getElementById(`ed-l-uni-${id}`).value;
        const newHis = document.getElementById(`ed-l-his-${id}`).value;
        const newVal = parseFloat(document.getElementById(`ed-l-val-${id}`).value);
        await databases.updateDocument(DB_ID, COLL_MOV, id, { data: newData, unidade: newUni, desc: newHis, valor: newVal });
        await renderLanTable(); processarDashboard(); showToast("Atualizado");
    }

    // DASHBOARD e DRE (resumidos, mas mantendo funcionalidade)
    async function processarDashboard() { /* igual ao anterior, mas adaptado */ 
        const res = await databases.listDocuments(DB_ID, COLL_MOV, [Query.limit(5000)]);
        const unidadeFiltro = document.getElementById('dash-uni').value;
        const ini = document.getElementById('dash-ini').value, fim = document.getElementById('dash-fim').value;
        const contasSel = Array.from(document.querySelectorAll('.dash-ck:checked')).map(cb => cb.value);
        let totals = { Santos: {r:0,c:0}, Camaçari: {r:0,c:0}, Geral: {r:0,c:0} };
        for(const doc of res.documents) {
            if(doc.data < ini || doc.data > fim) continue;
            if(!contasSel.includes(doc.cat)) continue;
            const nature = cacheAcc[doc.cat]?.nature || doc.tipo;
            const unidade = doc.unidade || 'Santos';
            if(nature === 'recebimento') { totals[unidade].r += doc.valor; totals.Geral.r += doc.valor; }
            else if(nature === 'custo' || nature === 'estoque') { totals[unidade].c += doc.valor; totals.Geral.c += doc.valor; }
        }
        let exibeR = (unidadeFiltro==='Todas') ? totals.Geral.r : totals[unidadeFiltro]?.r || 0;
        let exibeC = (unidadeFiltro==='Todas') ? totals.Geral.c : totals[unidadeFiltro]?.c || 0;
        document.getElementById('dash-cards').innerHTML = `<div class="stat-card"><span>Receitas</span><h2 style="color:var(--primary)">R$ ${exibeR.toLocaleString('pt-BR')}</h2></div>
        <div class="stat-card" style="border-left-color:var(--danger)"><span>Custos/Estoques</span><h2 style="color:var(--danger)">R$ ${exibeC.toLocaleString('pt-BR')}</h2></div>
        <div class="stat-card"><span>Resultado Líquido</span><h2>R$ ${(exibeR - exibeC).toLocaleString('pt-BR')}</h2></div>`;
        if(chartGeral) chartGeral.destroy();
        chartGeral = new Chart(document.getElementById('chartGeral'), { type: 'bar', data: { labels: ['Receita','Custo','Resultado'], datasets: [{ label: 'Geral', data: [totals.Geral.r, totals.Geral.c, totals.Geral.r - totals.Geral.c], backgroundColor: ['#22c55e','#ef4444','#0f2419'] }] } });
        if(chartUni) chartUni.destroy();
        chartUni = new Chart(document.getElementById('chartUnidades'), { type: 'bar', data: { labels: ['Santos','Camaçari'], datasets: [{ label: 'Resultado Líquido', data: [totals.Santos.r - totals.Santos.c, totals.Camaçari.r - totals.Camaçari.c], backgroundColor: '#00a859' }] } });
    }
    async function gerarDRE() { /* similar, omitido para brevidade, mas funcional */ 
        const res = await databases.listDocuments(DB_ID, COLL_MOV, [Query.limit(5000)]);
        const uni = document.getElementById('dre-uni').value, ini = document.getElementById('dre-ini').value, fim = document.getElementById('dre-fim').value;
        const contasSel = Array.from(document.querySelectorAll('.dre-ck:checked')).map(cb => cb.value);
        let receitas=0, custos=0, linhas={};
        for(const doc of res.documents) {
            if(doc.data<ini||doc.data>fim) continue;
            if(uni!=='Todas' && doc.unidade!==uni) continue;
            if(!contasSel.includes(doc.cat)) continue;
            const acc = cacheAcc[doc.cat];
            if(!acc || acc.nature==='ativo') continue;
            if(!linhas[doc.cat]) linhas[doc.cat]={desc:acc.description, valor:0, nature:acc.nature};
            linhas[doc.cat].valor += doc.valor;
        }
        let html='<tr style="background:#f1f5f9; font-weight:bold"><td>(+) RECEITAS OPERACIONAIS</td><td>---</td></tr>';
        for(const v of Object.values(linhas)) if(v.nature==='recebimento') { receitas+=v.valor; html+=`<tr><td style="padding-left:25px">${escapeHtml(v.desc)}</td><td>R$ ${v.valor.toLocaleString('pt-BR')}</td></tr>`; }
        html+='<tr style="background:#f1f5f9; font-weight:bold"><td>(-) CUSTOS E ESTOQUES</td><td>---</td></tr>';
        for(const v of Object.values(linhas)) if(v.nature==='custo'||v.nature==='estoque') { custos+=v.valor; html+=`<tr><td style="padding-left:25px">${escapeHtml(v.desc)}</td><td style="color:var(--danger)">R$ (${v.valor.toLocaleString('pt-BR')})</td></tr>`; }
        html+=`<tr style="background:var(--dark); color:white; font-weight:bold"><td>RESULTADO DO EXERCÍCIO</td><td>R$ ${(receitas-custos).toLocaleString('pt-BR')}</td></tr>`;
        document.getElementById('dre-corpo').innerHTML = html;
        if(chartDRE) chartDRE.destroy();
        chartDRE = new Chart(document.getElementById('chartDRE'), { type: 'doughnut', data: { labels: ['Receitas','Custos/Estoque'], datasets: [{ data: [receitas, custos], backgroundColor: ['#22c55e','#ef4444'] }] } });
    }

    function showView(view, btn) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        document.getElementById(view).classList.add('active');
        btn.classList.add('active');
        if(view === 'lancamentos') renderLanTable();
        if(view === 'plano') carregarContas();
        if(view === 'dashboard') processarDashboard();
    }

    window.onload = async () => {
        setDatasPadrao();
        await carregarContas();
        await renderLanTable();
        processarDashboard();
    };
</script>
