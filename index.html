<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CryoFinance Pro v11.2 – Correção de Erro</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #00a859;
            --dark: #0f2419;
            --danger: #ef4444;
            --border: #e2e8f0;
            --bg: #f8fafc;
            --sidebar-w: 250px;
            --sidebar-w-mobile: 70px;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: #1e293b;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }
        aside {
            width: var(--sidebar-w);
            background: var(--dark);
            color: white;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
            z-index: 10;
        }
        .brand {
            padding: 25px 20px;
            background: #0a1a12;
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--primary);
            border-bottom: 1px solid #1d402f;
        }
        nav { flex: 1; padding: 15px 0; }
        .menu-item {
            padding: 16px 20px;
            cursor: pointer;
            border: none;
            background: none;
            color: #94a3b8;
            text-align: left;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .menu-item i { min-width: 24px; }
        .menu-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .menu-item.active { background: var(--primary); color: white; font-weight: 600; }
        main { flex: 1; overflow-y: auto; padding: 20px; }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }
        .grid-header {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        label { display: block; font-size: 11px; font-weight: 800; color: #64748b; margin-bottom: 6px; text-transform: uppercase; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            background: white;
        }
        .excel-filter { position: relative; width: 100%; }
        .filter-box {
            background: white;
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 42px;
        }
        .filter-options {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            z-index: 1000;
            max-height: 260px;
            overflow-y: auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin-top: 5px;
        }
        .filter-options.show { display: block; }
        .opt { padding: 8px 12px; display: flex; align-items: center; gap: 10px; font-size: 12px; border-bottom: 1px solid #f1f5f9; }
        .opt label { margin: 0; font-weight: normal; text-transform: none; cursor: pointer; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 14px 12px; background: #f8fafc; color: #64748b; font-size: 11px; font-weight: 700; border-bottom: 2px solid var(--border); text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        .btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-ghost { background: transparent; color: #475569; }
        .btn-ghost:hover { background: #f1f5f9; }
        .dash-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            border-left: 5px solid var(--primary);
        }
        .stat-card span { font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; }
        .stat-card h2 { margin: 8px 0 0; font-size: 1.7rem; }
        .row-editing { background: #f0fff4 !important; outline: 1px solid var(--primary); }
        .badge {
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
        }
        .badge-rec { background: #dcfce7; color: #166534; }
        .badge-cus { background: #fee2e2; color: #991b1b; }
        .badge-ati { background: #f1f5f9; color: #475569; }
        .badge-est { background: #e0f2fe; color: #0369a1; }
        .toast-msg {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 13px;
            z-index: 9999;
            animation: fadeOut 3s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        @media (max-width: 768px) {
            aside { width: var(--sidebar-w-mobile); }
            .brand { text-align: center; padding: 20px 0; font-size: 1rem; }
            .menu-item span { display: none; }
            .menu-item i { margin: 0 auto; font-size: 1.3rem; }
            .menu-item { justify-content: center; padding: 16px 0; }
            main { padding: 15px; }
            .grid-header { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<aside>
    <div class="brand">CRYO</div>
    <nav>
        <button class="menu-item active" onclick="showView('dashboard', this)"><i class="fas fa-chart-line"></i><span>Dashboard</span></button>
        <button class="menu-item" onclick="showView('plano', this)"><i class="fas fa-list-ul"></i><span>Plano de Contas</span></button>
        <button class="menu-item" onclick="showView('lancamentos', this)"><i class="fas fa-exchange-alt"></i><span>Lançamentos</span></button>
        <button class="menu-item" onclick="showView('dre', this)"><i class="fas fa-file-invoice-dollar"></i><span>DRE</span></button>
    </nav>
</aside>

<main>
    <section id="dashboard" class="view-section active">
        <div class="card">
            <div class="grid-header">
                <div><label>Unidade</label><select id="dash-uni"><option value="Todas">Todas</option><option value="Santos">Santos</option><option value="Camaçari">Camaçari</option></select></div>
                <div class="excel-filter">
                    <label>Filtro de Contas</label>
                    <div class="filter-box" onclick="toggleDropdown('dash-opt')"><span id="dash-sel-txt">Todas</span><i class="fas fa-chevron-down"></i></div>
                    <div id="dash-opt" class="filter-options"><div class="opt"><b><input type="checkbox" id="dash-all" checked onchange="toggleAll('dash')"> Selecionar Todas</b></div><div id="dash-list"></div></div>
                </div>
                <div><label>Início</label><input type="date" id="dash-ini"></div><div><label>Fim</label><input type="date" id="dash-fim"></div>
                <button class="btn btn-primary" onclick="processarDashboard()"><i class="fas fa-sync"></i> Atualizar</button>
            </div>
        </div>
        <div id="dash-cards" class="dash-grid"></div>
        <div class="card"><h3>Visão Consolidada</h3><canvas id="chartGeral" height="100"></canvas></div>
        <div class="card"><h4>Resultado por Unidade</h4><canvas id="chartUnidades" height="150"></canvas></div>
    </section>

    <section id="plano" class="view-section">
        <div class="card">
            <form id="formPlano" class="grid-header" onsubmit="event.preventDefault(); criarPlano();">
                <input type="text" id="p-codigo" placeholder="Código (Ex: 3.1.1.01)" required>
                <input type="text" id="p-desc" placeholder="Descrição da Conta" required>
                <input type="text" id="p-estoque" placeholder="Descrição Estoque (opcional)">
                <select id="p-natureza">
                    <option value="recebimento">Recebimento (+)</option><option value="custo">Custo (-)</option>
                    <option value="estoque">Estoque (Custo)</option><option value="ativo">Ativo</option>
                </select>
                <button type="submit" class="btn btn-primary">Adicionar Conta</button>
            </form>
        </div>
        <div class="card"><div class="table-responsive"><table><thead><tr><th>CÓDIGO</th><th>DESCRIÇÃO</th><th>ESTOQUE</th><th>NATUREZA</th><th>AÇÕES</th></tr></thead><tbody id="p-corpo"></tbody></table></div></div>
    </section>

    <section id="lancamentos" class="view-section">
        <div class="card">
            <form id="formLan" class="grid-header" onsubmit="event.preventDefault(); criarLan();">
                <input type="date" id="l-data" required>
                <select id="l-uni"><option value="Santos">Santos</option><option value="Camaçari">Camaçari</option></select>
                <select id="l-conta" required></select>
                <input type="text" id="l-desc" placeholder="Histórico / Referência" required>
                <input type="number" step="0.01" id="l-valor" placeholder="R$ 0,00" required>
                <button type="submit" class="btn btn-primary">Salvar Lançamento</button>
            </form>
        </div>
        <div class="card"><div class="table-responsive">\n<table><thead><tr><th>DATA</th><th>UNIDADE</th><th>CONTA</th><th>TIPO</th><th>HISTÓRICO</th><th>VALOR</th><th>AÇÕES</th></tr></thead><tbody id="l-corpo"></tbody></table></div></div>
    </section>

    <section id="dre" class="view-section">
        <div class="card">
            <div class="grid-header">
                <div><label>Unidade</label><select id="dre-uni"><option value="Todas">Todas</option><option value="Santos">Santos</option><option value="Camaçari">Camaçari</option></select></div>
                <div class="excel-filter"><label>Filtro Contas DRE</label><div class="filter-box" onclick="toggleDropdown('dre-opt')"><span id="dre-sel-txt">Todas</span><i class="fas fa-chevron-down"></i></div><div id="dre-opt" class="filter-options"><div class="opt"><b><input type="checkbox" id="dre-all" checked onchange="toggleAll('dre')"> Selecionar Todas</b></div><div id="dre-list"></div></div></div>
                <div><label>Início</label><input type="date" id="dre-ini"></div><div><label>Fim</label><input type="date" id="dre-fim"></div>
                <button class="btn btn-primary" onclick="gerarDRE()"><i class="fas fa-chart-pie"></i> Gerar DRE</button>
            </div>
        </div>
        <div class="card"><div class="table-responsive"><table><thead><tr><th>ESTRUTURA DRE</th><th>VALOR (R$)</th></tr></thead><tbody id="dre-corpo"></tbody></table></div></div>
        <div class="card"><canvas id="chartDRE" height="200"></canvas></div>
    </section>
</main>

<script>
    const { Client, Databases, ID, Query } = Appwrite;
    const client = new Client().setEndpoint('https://nyc.cloud.appwrite.io/v1').setProject('69f35a44003278bff900');
    const databases = new Databases(client);
    const DB_ID = '69f0c5c503918981596';       // cryotronics_db
    const COLL_ACC = 'accounts';
    const COLL_MOV = 'movimentacoes';

    let cacheAcc = {};
    let chartGeral = null, chartUni = null, chartDRE = null;

    // -------------------- PLANO DE CONTAS COMPLETO (MESMO DO ANTERIOR) --------------------
    const contasPadrao = [ ... ]; // (mesmo array do código anterior, por questões de espaço omito, mas manter igual)
    // COLOQUE AQUI O MESMO ARRAY DE 150+ CONTAS QUE VOCÊ JÁ TINHA

    async function inicializarSistema() {
        try {
            // Tenta listar as contas
            const res = await databases.listDocuments(DB_ID, COLL_ACC, [Query.limit(1)]);
            if (res.total === 0) {
                showToast("Nenhuma conta encontrada. Inserindo plano de contas padrão...");
                for (const conta of contasPadrao) {
                    await databases.createDocument(DB_ID, COLL_ACC, ID.unique(), {
                        code: conta.code,
                        description: conta.description,
                        stock_desc: "",
                        nature: conta.nature
                    });
                }
                showToast("Plano de contas carregado com sucesso!");
            }
        } catch (err) {
            console.error("Erro detalhado ao acessar coleção 'accounts':", err);
            let msg = "Erro ao carregar contas: ";
            if (err.code === 404) msg += "Coleção 'accounts' não existe. Crie-a manualmente no Appwrite com os atributos: code (string), description (string), stock_desc (string), nature (string).";
            else if (err.code === 401) msg += "Permissão negada. Verifique as regras de acesso da coleção (configure permissão de leitura/escrita para usuários anônimos ou habilite autenticação).";
            else msg += err.message;
            showToast(msg, true);
            document.getElementById('p-corpo').innerHTML = `<tr><td colspan="5" style="color:red; text-align:center">${msg}</td></tr>`;
            return;
        }
        await carregarContas(); // recarrega a lista
    }

    async function carregarContas() {
        try {
            const res = await databases.listDocuments(DB_ID, COLL_ACC, [Query.limit(500), Query.orderAsc('code')]);
            cacheAcc = {};
            const lConta = document.getElementById('l-conta');
            const pCorpo = document.getElementById('p-corpo');
            const dashList = document.getElementById('dash-list');
            const dreList = document.getElementById('dre-list');
            if(lConta) lConta.innerHTML = '<option value="">-- Selecione --</option>';
            pCorpo.innerHTML = '';
            dashList.innerHTML = '';
            dreList.innerHTML = '';

            for(const doc of res.documents) {
                cacheAcc[doc.code] = { ...doc, nature: doc.nature };
                if(lConta) lConta.innerHTML += `<option value="${doc.code}">${doc.code} - ${escapeHtml(doc.description)}</option>`;
                const optDash = `<div class="opt"><input type="checkbox" class="dash-ck" value="${doc.code}" checked onchange="updateTxt('dash')"> <label>${doc.code} - ${escapeHtml(doc.description)}</label></div>`;
                const optDre = `<div class="opt"><input type="checkbox" class="dre-ck" value="${doc.code}" checked onchange="updateTxt('dre')"> <label>${doc.code} - ${escapeHtml(doc.description)}</label></div>`;
                dashList.innerHTML += optDash;
                dreList.innerHTML += optDre;
                pCorpo.innerHTML += `<tr id="row-p-${doc.$id}">
                    <td>${escapeHtml(doc.code)}</td><td>${escapeHtml(doc.description)}</td><td>${escapeHtml(doc.stock_desc || '')}</td>
                    <td>${doc.nature}</td>
                    <td><button class="btn btn-ghost" onclick="ativarEdicaoPlano('${doc.$id}')"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-ghost" style="color:var(--danger)" onclick="excluirConta('${doc.$id}','${doc.code}')"><i class="fas fa-trash"></i></button></td>
                 </tr>`;
            }
            updateTxt('dash');
            updateTxt('dre');
        } catch(e) {
            console.error(e);
            showToast("Erro ao carregar contas: "+e.message, true);
            document.getElementById('p-corpo').innerHTML = `<tr><td colspan="5" style="color:red">Falha ao carregar contas: ${e.message}</td></tr>`;
        }
    }

    // As demais funções (criarPlano, excluirConta, edicao, lançamentos, dashboard, DRE) permanecem IDÊNTICAS às do código anterior,
    // pois o problema era apenas inicialização. Para economizar espaço, mantenha as funções já funcionais do último código enviado.
    // Abaixo um resumo das que precisam ser mantidas (você já tem elas no código anterior, apenas copie e cole):

    // showToast, toggleDropdown, toggleAll, updateTxt, escapeHtml,
    // criarPlano, excluirConta, ativarEdicaoPlano, salvarEdicaoPlano,
    // criarLan, renderLanTable, excluirLan, ativarEdicaoLan, salvarEdicaoLan,
    // processarDashboard, gerarDRE, showView, setDatasPadrao

    // ATENÇÃO: certifique-se de que a função `processarDashboard` e `gerarDRE` usem cacheAcc e as collections corretamente.

    window.onload = async () => {
        setDatasPadrao();
        await inicializarSistema();
        await renderLanTable();
        processarDashboard();
    };
</script>
</body>
</html>
