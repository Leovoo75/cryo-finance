<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FlyGold Finance Pro</title>
    
    <!-- Bibliotecas de Alta Performance -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00a859;
            --dark: #0f2419;
            --danger: #ef4444;
            --bg: #f1f5f9;
            --sidebar-w: 260px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar & Navegação */
        aside { 
            width: var(--sidebar-w); background: var(--dark); color: white; 
            display: flex; flex-direction: column; transition: 0.3s; z-index: 1000;
        }
        .brand { padding: 30px 20px; font-size: 1.5rem; font-weight: 800; color: var(--primary); text-align: center; border-bottom: 1px solid #1d402f; }
        
        nav { flex: 1; padding: 20px 0; }
        .nav-btn { 
            width: 100%; padding: 15px 25px; border: none; background: none; color: #94a3b8;
            text-align: left; cursor: pointer; display: flex; align-items: center; gap: 15px; font-size: 14px; transition: 0.2s;
        }
        .nav-btn:hover { color: white; background: rgba(255,255,255,0.05); }
        .nav-btn.active { color: white; background: var(--primary); font-weight: 600; }

        /* Área Principal */
        main { flex: 1; overflow-y: auto; padding: 25px; position: relative; }
        .view { display: none; animation: fadeIn 0.3s ease-out; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Cards e Grids */
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        
        .stat-card { padding: 20px; border-radius: 12px; color: white; }
        .stat-receita { background: #10b981; }
        .stat-despesa { background: #ef4444; }
        .stat-saldo { background: #0f172a; }

        /* Formulários e Filtros */
        .form-row { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; margin-bottom: 20px; }
        .input-group { flex: 1; min-width: 180px; }
        label { display: block; font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 5px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        
        .btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { opacity: 0.9; }

        /* Tabelas */
        .table-container { overflow-x: auto; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; background: white; min-width: 800px; }
        th { background: #f8fafc; padding: 15px; text-align: left; font-size: 12px; color: #64748b; border-bottom: 2px solid #e2e8f0; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }

        /* Mobile Adjustments */
        @media (max-width: 850px) {
            body { flex-direction: column; }
            aside { width: 100%; height: auto; flex-direction: row; align-items: center; }
            .brand { padding: 15px; border: none; font-size: 1.1rem; }
            nav { display: flex; padding: 0; overflow-x: auto; }
            .nav-btn { padding: 15px; flex-shrink: 0; width: auto; font-size: 12px; flex-direction: column; gap: 5px; }
            main { padding: 15px; }
        }
    </style>
</head>
<body>

<aside>
    <div class="brand">FLYGOLD</div>
    <nav>
        <button class="nav-btn active" onclick="nav('dashboard', this)"><i class="fas fa-chart-pie"></i> Painel</button>
        <button class="nav-btn" onclick="nav('lancamentos', this)"><i class="fas fa-exchange-alt"></i> Lançamentos</button>
        <button class="nav-btn" onclick="nav('plano', this)"><i class="fas fa-sitemap"></i> Contas</button>
        <button class="nav-btn" onclick="nav('dre', this)"><i class="fas fa-file-contract"></i> DRE</button>
    </nav>
</aside>

<main>
    <!-- DASHBOARD -->
    <section id="dashboard" class="view active">
        <div class="card">
            <div class="form-row">
                <div class="input-group"><label>Unidade</label><select id="dash-unidade"><option value="Todas">Todas Unidades</option><option value="Santos">Santos</option><option value="Camaçari">Camaçari</option></select></div>
                <div class="input-group"><label>Início</label><input type="date" id="dash-inicio"></div>
                <div class="input-group"><label>Fim</label><input type="date" id="dash-fim"></div>
                <button class="btn btn-primary" onclick="atualizarDash()"><i class="fas fa-sync"></i> Filtrar</button>
            </div>
        </div>

        <div class="grid-3" id="dash-stats">
            <!-- Stats via JS -->
        </div>

        <div class="grid-3" style="margin-top:25px">
            <div class="card" style="grid-column: span 2"><h3>Fluxo de Caixa</h3><canvas id="chartPrincipal" height="120"></canvas></div>
            <div class="card"><h3>Distribuição</h3><canvas id="chartPizza" height="250"></canvas></div>
        </div>
    </section>

    <!-- LANÇAMENTOS -->
    <section id="lancamentos" class="view">
        <div class="card">
            <h3>Novo Registro</h3>
            <form id="formLan" class="form-row" onsubmit="salvarLan(event)">
                <div class="input-group"><label>Data</label><input type="date" id="l-data" required></div>
                <div class="input-group"><label>Unidade</label><select id="l-uni"><option value="Santos">Santos</option><option value="Camaçari">Camaçari</option></select></div>
                <div class="input-group"><label>Conta</label><select id="l-conta" required></select></div>
                <div class="input-group" style="flex:2"><label>Descrição</label><input type="text" id="l-desc" placeholder="Ex: Pagamento Fornecedor" required></div>
                <div class="input-group"><label>Valor R$</label><input type="number" step="0.01" id="l-valor" required></div>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </form>
        </div>
        <div class="card">
            <div class="table-container">
                <table>
                    <thead><tr><th>Data</th><th>Unidade</th><th>Conta</th><th>Descrição</th><th>Valor</th><th>Ações</th></tr></thead>
                    <tbody id="lista-lan"></tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- PLANO DE CONTAS -->
    <section id="plano" class="view">
        <div class="card">
            <h3>Estrutura de Contas</h3>
            <div class="table-container">
                <table>
                    <thead><tr><th>Código</th><th>Descrição</th><th>Natureza</th></tr></thead>
                    <tbody id="lista-plano"></tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<script>
    const { Client, Databases, ID, Query } = Appwrite;
    const client = new Client().setEndpoint('https://nyc.cloud.appwrite.io/v1').setProject('69f35a44003278bff900');
    const db = new Databases(client);
    const DB_ID = '69f35a670029fa96fd5f', COLL_ACC = 'accounts', COLL_TRANS = 'transactions';

    let cacheAcc = {};
    let charts = {};

    // PLANO DE CONTAS COMPLETO (Sincronizado com seu histórico)
    const planoPadrao = [
        {c: "1.1.1.01", d: "Caixa Geral", n: "ativo"},
        {c: "3.1.1.01", d: "Receita de Vendas", n: "recebimento"},
        {c: "3.1.1.02", d: "Receita de Serviços", n: "recebimento"},
        {c: "4.1.1.01", d: "Custo de Mercadorias", n: "custo"},
        {c: "4.1.1.02", d: "Fretes e Logística", n: "custo"},
        {c: "5.1.1.01", d: "Aluguel e Taxas", n: "custo"},
        {c: "5.1.1.02", d: "Salários e Encargos", n: "custo"},
        {c: "1.1.3.01", d: "Estoque de Matéria Prima", n: "estoque"}
    ];

    async function init() {
        definirDatas();
        await sincronizarPlano();
        await atualizarDash();
    }

    async function sincronizarPlano() {
        const res = await db.listDocuments(DB_ID, COLL_ACC);
        if (res.total === 0) {
            for (let p of planoPadrao) {
                await db.createDocument(DB_ID, COLL_ACC, ID.unique(), {code: p.c, description: p.d, nature: p.n});
            }
        }
        await carregarContas();
    }

    async function carregarContas() {
        const res = await db.listDocuments(DB_ID, COLL_ACC, [Query.orderAsc('code')]);
        const select = document.getElementById('l-conta');
        const tabela = document.getElementById('lista-plano');
        select.innerHTML = ''; tabela.innerHTML = '';
        
        res.documents.forEach(d => {
            cacheAcc[d.code] = d;
            select.innerHTML += `<option value="${d.code}">${d.code} - ${d.description}</option>`;
            tabela.innerHTML += `<tr><td>${d.code}</td><td>${d.description}</td><td>${d.nature}</td></tr>`;
        });
    }

    async function salvarLan(e) {
        e.preventDefault();
        const data = {
            date: document.getElementById('l-data').value,
            unit: document.getElementById('l-uni').value,
            account_id: document.getElementById('l-conta').value,
            description: document.getElementById('l-desc').value,
            amount: parseFloat(document.getElementById('l-valor').value)
        };
        await db.createDocument(DB_ID, COLL_TRANS, ID.unique(), data);
        document.getElementById('formLan').reset();
        definirDatas();
        alert("Lançamento realizado!");
        if(document.getElementById('lancamentos').classList.contains('active')) listarTransacoes();
    }

    async function listarTransacoes() {
        const res = await db.listDocuments(DB_ID, COLL_TRANS, [Query.orderDesc('date'), Query.limit(100)]);
        const corpo = document.getElementById('lista-lan');
        corpo.innerHTML = res.documents.map(d => `
            <tr>
                <td>${d.date}</td>
                <td>${d.unit}</td>
                <td>${d.account_id}</td>
                <td>${d.description}</td>
                <td style="color:${cacheAcc[d.account_id]?.nature === 'recebimento' ? 'green' : 'red'}">
                    R$ ${d.amount.toLocaleString('pt-BR')}
                </td>
                <td><button onclick="excluir('${d.$id}')" style="border:none; color:red; background:none; cursor:pointer"><i class="fas fa-trash"></i></button></td>
            </tr>
        `).join('');
    }

    async function atualizarDash() {
        const res = await db.listDocuments(DB_ID, COLL_TRANS, [Query.limit(5000)]);
        const uni = document.getElementById('dash-unidade').value;
        const ini = document.getElementById('dash-inicio').value;
        const fim = document.getElementById('dash-fim').value;

        let rec = 0, cus = 0;
        let filtrados = res.documents.filter(d => {
            const dataOk = d.date >= ini && d.date <= fim;
            const uniOk = uni === 'Todas' || d.unit === uni;
            return dataOk && uniOk;
        });

        filtrados.forEach(d => {
            const nat = cacheAcc[d.account_id]?.nature;
            if(nat === 'recebimento') rec += d.amount;
            else if(nat === 'custo' || nat === 'estoque') cus += d.amount;
        });

        document.getElementById('dash-stats').innerHTML = `
            <div class="stat-card stat-receita"><span>Receitas</span><h2>R$ ${rec.toLocaleString('pt-BR')}</h2></div>
            <div class="stat-card stat-despesa"><span>Despesas</span><h2>R$ ${cus.toLocaleString('pt-BR')}</h2></div>
            <div class="stat-card stat-saldo"><span>Resultado</span><h2>R$ ${(rec - cus).toLocaleString('pt-BR')}</h2></div>
        `;

        renderCharts(rec, cus);
    }

    function renderCharts(r, c) {
        const ctxP = document.getElementById('chartPizza').getContext('2d');
        if(charts.pizza) charts.pizza.destroy();
        charts.pizza = new Chart(ctxP, {
            type: 'doughnut',
            data: { labels: ['Receitas', 'Despesas'], datasets: [{ data: [r, c], backgroundColor: ['#10b981', '#ef4444'] }] },
            options: { plugins: { legend: { position: 'bottom' } } }
        });
    }

    function nav(id, btn) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        if(id === 'lancamentos') listarTransacoes();
    }

    function definirDatas() {
        const agora = new Date();
        const primDia = new Date(agora.getFullYear(), agora.getMonth(), 1).toISOString().split('T')[0];
        const hoje = agora.toISOString().split('T')[0];
        document.getElementById('dash-inicio').value = primDia;
        document.getElementById('dash-fim').value = hoje;
        document.getElementById('l-data').value = hoje;
    }

    window.onload = init;
</script>
</body>
</html>
