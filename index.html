<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryoFinance Pro v10.9.2</title>
    
    <!-- Bibliotecas -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #00a859; 
            --primary-hover: #008f4c;
            --dark: #0f2419; 
            --danger: #ef4444; 
            --border: #e2e8f0; 
            --bg: #f8fafc; 
            --sidebar-w: 260px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            background: var(--bg); 
            color: #1e293b; 
            overflow: hidden; 
        }
        
        /* SIDEBAR */
        aside { 
            width: var(--sidebar-w); 
            background: var(--dark); 
            color: white; 
            flex-shrink: 0; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 4px 0 15px rgba(0,0,0,0.2);
            transition: var(--transition);
            z-index: 1000;
        }

        .brand { 
            padding: 25px 20px; 
            background: #0a1a12; 
            font-weight: 800; 
            font-size: 1.4rem; 
            color: var(--primary); 
            letter-spacing: -0.5px;
            border-bottom: 1px solid #1d402f; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-menu { display: none; cursor: pointer; font-size: 1.5rem; color: #94a3b8; }

        nav { flex: 1; padding: 20px 0; overflow-y: auto; }

        .menu-item { 
            padding: 14px 20px; 
            cursor: pointer; 
            border: none; 
            background: none; 
            color: #94a3b8; 
            text-align: left; 
            width: 100%; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            font-size: 15px; 
            transition: var(--transition); 
        }

        .menu-item i { width: 20px; text-align: center; font-size: 1.1rem; }
        .menu-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .menu-item.active { background: var(--primary); color: white; font-weight: 600; box-shadow: 0 4px 12px rgba(0, 168, 89, 0.3); }
        
        /* CONTEÚDO PRINCIPAL */
        main { 
            flex: 1; 
            overflow-y: auto; 
            padding: 25px; 
            position: relative; 
            -webkit-overflow-scrolling: touch; 
        }
        
        .mobile-header {
            display: none;
            background: var(--dark);
            color: white;
            padding: 15px 20px;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 900;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .view-section { display: none; max-width: 1200px; margin: 0 auto; }
        .view-section.active { display: block; animation: slideUp 0.4s ease; }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* CARDS E FORMULÁRIOS */
        .card { 
            background: white; 
            border-radius: 16px; 
            padding: 20px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
            margin-bottom: 25px; 
            border: 1px solid var(--border); 
        }

        .card h3 { margin-top: 0; margin-bottom: 20px; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }

        .grid-header { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; 
            align-items: flex-end; 
            margin-bottom: 5px; 
        }

        label { display: block; font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            font-size: 15px; 
            background: #fff;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); ring: 2px solid rgba(0,168,89,0.1); }

        /* TABELAS RESPONSIVAS */
        .table-responsive { 
            width: 100%; 
            overflow-x: auto; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
        }

        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { text-align: left; padding: 14px; background: #f8fafc; color: #64748b; font-size: 12px; font-weight: 700; text-transform: uppercase; border-bottom: 2px solid var(--border); }
        td { padding: 14px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        tr:hover td { background: #fcfdfe; }
        
        .btn { 
            padding: 12px 20px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; 
            font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; 
            transition: var(--transition);
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-danger { background: #fee2e2; color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }

        /* DASHBOARD STATS */
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { 
            background: white; 
            padding: 20px; 
            border-radius: 16px; 
            border-left: 6px solid var(--primary); 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .stat-card span { font-size: 13px; color: #64748b; font-weight: 600; }
        .stat-card h2 { margin: 8px 0 0; font-size: 1.6rem; letter-spacing: -1px; }

        /* DRE ESPECÍFICO */
        .dre-row-master { font-weight: 800; background: #f1f5f9; }
        .dre-row-sub { padding-left: 30px; color: #475569; }
        .val-neg { color: var(--danger); }
        .val-pos { color: var(--primary); }

        /* MOBILE OVERRIDES */
        @media (max-width: 850px) {
            aside { position: fixed; left: 0; top: 0; height: 100vh; transform: translateX(-100%); }
            aside.open { transform: translateX(0); }
            .mobile-header { display: flex; }
            .close-menu { display: block; }
            main { padding: 15px; height: calc(100vh - 60px); }
            .grid-header { grid-template-columns: 1fr; }
            .stat-card h2 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<div class="mobile-header">
    <div style="font-weight: 800; color: var(--primary); letter-spacing: -1px;">CRYO FINANCE</div>
    <i class="fas fa-bars" onclick="toggleSidebar()"></i>
</div>

<aside id="sidebar">
    <div class="brand">
        CRYO FINANCE <i class="fas fa-times close-menu" onclick="toggleSidebar()"></i>
    </div>
    <nav>
        <button class="menu-item active" onclick="showView('dashboard', this)"><i class="fas fa-th-large"></i> Dashboard</button>
        <button class="menu-item" onclick="showView('plano', this)"><i class="fas fa-sitemap"></i> Plano de Contas</button>
        <button class="menu-item" onclick="showView('lancamentos', this)"><i class="fas fa-file-invoice"></i> Lançamentos</button>
        <button class="menu-item" onclick="showView('dre', this)"><i class="fas fa-chart-bar"></i> DRE Consolidado</button>
    </nav>
</aside>

<main>
    <!-- VIEW: DASHBOARD -->
    <section id="dashboard" class="view-section active">
        <div class="card">
            <h3><i class="fas fa-filter"></i> Filtros Globais</h3>
            <div class="grid-header">
                <div><label>Unidade</label>
                    <select id="dash-uni" onchange="processarDashboard()">
                        <option value="Todas">Todas Unidades</option>
                        <option value="Santos">Santos</option>
                        <option value="Camaçari">Camaçari</option>
                    </select>
                </div>
                <div><label>Período Inicial</label><input type="date" id="dash-ini" onchange="processarDashboard()"></div>
                <div><label>Período Final</label><input type="date" id="dash-fim" onchange="processarDashboard()"></div>
                <button class="btn btn-primary" style="width: 100%" onclick="processarDashboard()"><i class="fas fa-sync"></i> Atualizar</button>
            </div>
        </div>

        <div id="dash-cards" class="dash-grid">
            <div class="stat-card"><span>RECEITA BRUTA</span><h2 id="st-receita" class="val-pos">R$ 0,00</h2></div>
            <div class="stat-card" style="border-color: #ef4444"><span>CUSTOS TOTAIS</span><h2 id="st-custo" class="val-neg">R$ 0,00</h2></div>
            <div class="stat-card" style="border-color: #3b82f6"><span>LUCRO LÍQUIDO</span><h2 id="st-lucro">R$ 0,00</h2></div>
        </div>

        <div class="card">
            <h3><i class="fas fa-chart-area"></i> Fluxo de Caixa Mensal</h3>
            <canvas id="chartGeral" height="120"></canvas>
        </div>
    </section>

    <!-- VIEW: PLANO DE CONTAS -->
    <section id="plano" class="view-section">
        <div class="card">
            <h3><i class="fas fa-plus-circle"></i> Nova Estrutura</h3>
            <form id="formPlano" class="grid-header" onsubmit="event.preventDefault(); criarPlano();">
                <div><label>Código</label><input type="text" id="p-codigo" placeholder="Ex: 1.01" required></div>
                <div><label>Descrição da Conta</label><input type="text" id="p-desc" placeholder="Ex: Venda de Serviços" required></div>
                <div><label>Natureza</label>
                    <select id="p-natureza">
                        <option value="recebimento">Recebimento (+)</option>
                        <option value="custo">Custo (-)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Cadastrar</button>
            </form>
        </div>
        <div class="card">
            <div class="table-responsive">
                <table id="tabela-plano">
                    <thead><tr><th>CÓDIGO</th><th>CONTA</th><th>TIPO</th><th width="100">AÇÕES</th></tr></thead>
                    <tbody id="p-corpo"></tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- VIEW: LANÇAMENTOS -->
    <section id="lancamentos" class="view-section">
        <div class="card">
            <h3><i class="fas fa-pen-fancy"></i> Registrar Movimentação</h3>
            <form id="formLan" class="grid-header" onsubmit="event.preventDefault(); criarLan();">
                <div><label>Data</label><input type="date" id="l-data" required></div>
                <div><label>Unidade</label>
                    <select id="l-uni">
                        <option value="Santos">Santos</option>
                        <option value="Camaçari">Camaçari</option>
                    </select>
                </div>
                <div><label>Conta</label><select id="l-conta" required></select></div>
                <div><label>Valor (R$)</label><input type="number" step="0.01" id="l-valor" placeholder="0,00" required></div>
                <button type="submit" class="btn btn-primary">Salvar Lançamento</button>
            </form>
        </div>
        <div class="card">
            <div class="table-responsive">
                <table>
                    <thead><tr><th>DATA</th><th>UNIDADE</th><th>CONTA</th><th>VALOR</th><th width="80">AÇÃO</th></tr></thead>
                    <tbody id="l-corpo"></tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- VIEW: DRE -->
    <section id="dre" class="view-section">
        <div class="card">
            <h3><i class="fas fa-file-invoice-dollar"></i> Relatório DRE</h3>
            <div class="grid-header">
                <div><label>Unidade</label><select id="dre-uni"><option value="Todas">Todas</option><option value="Santos">Santos</option><option value="Camaçari">Camaçari</option></select></div>
                <div><label>Início</label><input type="date" id="dre-ini"></div>
                <div><label>Fim</label><input type="date" id="dre-fim"></div>
                <button class="btn btn-primary" onclick="gerarDRE()"><i class="fas fa-search"></i> Gerar Relatório</button>
            </div>
        </div>
        <div class="card">
            <div class="table-responsive">
                <table>
                    <thead><tr><th>ESTRUTURA DE CONTAS</th><th style="text-align:right">VALOR CONSOLIDADO</th></tr></thead>
                    <tbody id="dre-corpo"></tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<script>
    // --- CONFIGURAÇÃO APPWRITE ---
    const { Client, Databases, ID, Query } = Appwrite;
    const client = new Client().setEndpoint('https://nyc.cloud.appwrite.io/v1').setProject('69f35a44003278bff900');
    const databases = new Databases(client);
    
    const DB_ID = '69f35a670029fa96fd5f';
    const COLL_ACC = 'accounts';
    const COLL_TRANS = 'transactions';

    let contasCache = [];
    let transacoesCache = [];
    let chartInst = null;

    // --- INICIALIZAÇÃO ---
    async function init() {
        definirDatasPadrao();
        await carregarContas();
        await carregarTransacoes();
        processarDashboard();
    }

    function definirDatasPadrao() {
        const hoje = new Date();
        const primeiroDia = new Date(hoje.getFullYear(), hoje.getMonth(), 1).toISOString().split('T')[0];
        const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).toISOString().split('T')[0];
        
        document.querySelectorAll('input[type="date"]').forEach(el => {
            if(!el.value) {
                if(el.id.includes('ini')) el.value = primeiroDia;
                else if(el.id.includes('fim')) el.value = ultimoDia;
                else el.value = hoje.toISOString().split('T')[0];
            }
        });
    }

    // --- GERENCIAMENTO DE UI ---
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

    function showView(viewId, btn) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        
        document.getElementById(viewId).classList.add('active');
        btn.classList.add('active');
        
        if(window.innerWidth <= 850) toggleSidebar();
        if(viewId === 'dre') gerarDRE();
    }

    // --- LÓGICA DE DADOS (PLANO DE CONTAS) ---
    async function carregarContas() {
        try {
            const resp = await databases.listDocuments(DB_ID, COLL_ACC, [Query.limit(100), Query.orderAsc('code')]);
            contasCache = resp.documents;
            renderPlano();
            atualizarSelectsContas();
        } catch (e) { console.error("Erro ao carregar contas", e); }
    }

    async function criarPlano() {
        const data = {
            code: document.getElementById('p-codigo').value,
            description: document.getElementById('p-desc').value,
            type: document.getElementById('p-natureza').value
        };
        try {
            await databases.createDocument(DB_ID, COLL_ACC, ID.unique(), data);
            document.getElementById('formPlano').reset();
            await carregarContas();
        } catch (e) { alert("Erro ao salvar conta."); }
    }

    function renderPlano() {
        const corpo = document.getElementById('p-corpo');
        corpo.innerHTML = contasCache.map(c => `
            <tr>
                <td><b>${c.code}</b></td>
                <td>${c.description}</td>
                <td><span class="btn" style="padding:4px 8px; font-size:10px; background:${c.type==='recebimento'?'#dcfce7':'#fee2e2'}">${c.type.toUpperCase()}</span></td>
                <td><button onclick="deletarDoc('${COLL_ACC}','${c.$id}')" class="btn btn-danger"><i class="fas fa-trash"></i></button></td>
            </tr>
        `).join('');
    }

    function atualizarSelectsContas() {
        const selects = ['l-conta'];
        selects.forEach(id => {
            const el = document.getElementById(id);
            el.innerHTML = contasCache.map(c => `<option value="${c.code}">${c.code} - ${c.description}</option>`).join('');
        });
    }

    // --- LÓGICA DE LANÇAMENTOS ---
    async function carregarTransacoes() {
        try {
            const resp = await databases.listDocuments(DB_ID, COLL_TRANS, [Query.limit(5000), Query.orderDesc('date')]);
            transacoesCache = resp.documents;
            renderLanTable();
        } catch (e) { console.error("Erro transacoes", e); }
    }

    async function criarLan() {
        const val = parseFloat(document.getElementById('l-valor').value);
        const data = {
            date: document.getElementById('l-data').value,
            unit: document.getElementById('l-uni').value,
            account_code: document.getElementById('l-conta').value,
            value: val
        };
        try {
            await databases.createDocument(DB_ID, COLL_TRANS, ID.unique(), data);
            document.getElementById('formLan').reset();
            definirDatasPadrao();
            await carregarTransacoes();
            processarDashboard();
        } catch (e) { alert("Erro no lançamento."); }
    }

    function renderLanTable() {
        const corpo = document.getElementById('l-corpo');
        corpo.innerHTML = transacoesCache.slice(0, 20).map(t => `
            <tr>
                <td>${new Date(t.date).toLocaleDateString('pt-BR', {timeZone: 'UTC'})}</td>
                <td>${t.unit}</td>
                <td>${t.account_code}</td>
                <td class="${isCusto(t.account_code)?'val-neg':'val-pos'}">R$ ${t.value.toLocaleString('pt-BR', {minimumFractionDigits:2})}</td>
                <td><button onclick="deletarDoc('${COLL_TRANS}','${t.$id}')" class="btn btn-danger"><i class="fas fa-trash"></i></button></td>
            </tr>
        `).join('');
    }

    function isCusto(code) {
        const conta = contasCache.find(c => c.code === code);
        return conta ? conta.type === 'custo' : false;
    }

    // --- LÓGICA DASHBOARD & CALCULOS ---
    function processarDashboard() {
        const uni = document.getElementById('dash-uni').value;
        const ini = document.getElementById('dash-ini').value;
        const fim = document.getElementById('dash-fim').value;

        let filtrados = transacoesCache.filter(t => {
            const d = t.date;
            const matchDate = d >= ini && d <= fim;
            const matchUni = uni === 'Todas' || t.unit === uni;
            return matchDate && matchUni;
        });

        let rec = 0, cus = 0;
        filtrados.forEach(t => {
            if(isCusto(t.account_code)) cus += t.value;
            else rec += t.value;
        });

        document.getElementById('st-receita').innerText = `R$ ${rec.toLocaleString('pt-BR', {minimumFractionDigits:2})}`;
        document.getElementById('st-custo').innerText = `R$ ${cus.toLocaleString('pt-BR', {minimumFractionDigits:2})}`;
        const lucro = rec - cus;
        const elLucro = document.getElementById('st-lucro');
        elLucro.innerText = `R$ ${lucro.toLocaleString('pt-BR', {minimumFractionDigits:2})}`;
        elLucro.className = lucro >= 0 ? 'val-pos' : 'val-neg';

        renderChart(filtrados);
    }

    function renderChart(dados) {
        const ctx = document.getElementById('chartGeral').getContext('2d');
        if(chartInst) chartInst.destroy();

        // Agrupar por mês
        const meses = {};
        dados.forEach(t => {
            const m = t.date.substring(0, 7);
            if(!meses[m]) meses[m] = { r: 0, c: 0 };
            if(isCusto(t.account_code)) meses[m].c += t.value;
            else meses[m].r += t.value;
        });

        const labels = Object.keys(meses).sort();
        chartInst = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Receitas', data: labels.map(l => meses[l].r), backgroundColor: '#00a859' },
                    { label: 'Custos', data: labels.map(l => meses[l].c), backgroundColor: '#ef4444' }
                ]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
    }

    // --- MOTOR DRE ---
    function gerarDRE() {
        const uni = document.getElementById('dre-uni').value;
        const ini = document.getElementById('dre-ini').value;
        const fim = document.getElementById('dre-fim').value;
        const corpo = document.getElementById('dre-corpo');
        
        let html = '';
        let totalReceita = 0;
        let totalCusto = 0;

        // Filtrar transações do período
        const filtradas = transacoesCache.filter(t => {
            const matchDate = t.date >= ini && t.date <= fim;
            const matchUni = uni === 'Todas' || t.unit === uni;
            return matchDate && matchUni;
        });

        // 1. Receitas
        html += `<tr class="dre-row-master"><td>1. RECEITA OPERACIONAL BRUTA</td><td id="dre-total-rec" style="text-align:right"></td></tr>`;
        contasCache.filter(c => c.type === 'recebimento').forEach(c => {
            const soma = filtradas.filter(t => t.account_code === c.code).reduce((a, b) => a + b.value, 0);
            totalReceita += soma;
            html += `<tr class="dre-row-sub"><td>${c.code} - ${c.description}</td><td style="text-align:right">R$ ${soma.toLocaleString('pt-BR',{minimumFractionDigits:2})}</td></tr>`;
        });

        // 2. Custos
        html += `<tr class="dre-row-master"><td>2. CUSTOS E DESPESAS</td><td id="dre-total-cus" style="text-align:right"></td></tr>`;
        contasCache.filter(c => c.type === 'custo').forEach(c => {
            const soma = filtradas.filter(t => t.account_code === c.code).reduce((a, b) => a + b.value, 0);
            totalCusto += soma;
            html += `<tr class="dre-row-sub"><td>${c.code} - ${c.description}</td><td style="text-align:right" class="val-neg">(R$ ${soma.toLocaleString('pt-BR',{minimumFractionDigits:2})})</td></tr>`;
        });

        // 3. Resultado
        const res = totalReceita - totalCusto;
        html += `<tr class="dre-row-master" style="background:#0f2419; color:white"><td>RESULTADO LÍQUIDO DO PERÍODO</td><td style="text-align:right">R$ ${res.toLocaleString('pt-BR',{minimumFractionDigits:2})}</td></tr>`;

        corpo.innerHTML = html;
        document.getElementById('dre-total-rec').innerText = `R$ ${totalReceita.toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
        document.getElementById('dre-total-cus').innerText = `(R$ ${totalCusto.toLocaleString('pt-BR',{minimumFractionDigits:2})})`;
    }

    async function deletarDoc(coll, id) {
        if(!confirm("Deseja excluir este registro?")) return;
        try {
            await databases.deleteDocument(DB_ID, coll, id);
            await carregarContas();
            await carregarTransacoes();
            processarDashboard();

    init();
