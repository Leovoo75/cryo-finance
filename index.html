<!DOCTYPE html>

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        :root { --primary: #00a859; --dark: #0f2419; --danger: #ef4444; --border: #e2e8f0; --bg: #f8fafc; --sidebar-w: 250px; }
        body { background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        aside { width: var(--sidebar-w); background: var(--dark); color: white; display: flex; flex-direction: column; transition: all 0.3s; }
        .brand { padding: 25px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #1d402f; color: var(--primary); }
        nav { flex: 1; padding: 10px 0; }
        .menu-btn { width: 100%; padding: 15px 25px; border: none; background: none; color: #94a3b8; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 14px; }
        .menu-btn i { width: 20px; }
        .menu-btn:hover, .menu-btn.active { background: #1a3528; color: white; }
        .menu-btn.active { border-left: 4px solid var(--primary); }
        main { flex: 1; overflow-y: auto; padding: 25px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        h2, h3 { margin-bottom: 15px; color: #1e293b; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: end; }
        label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #64748b; margin-bottom: 5px; display: block; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8fafc; text-align: left; padding: 12px; border-bottom: 2px solid var(--border); font-size: 11px; text-transform: uppercase; color: #64748b; }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; font-size: 12px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 5px 10px; font-size: 11px; }
        .btn-warning { background: #f59e0b; color: white; }
        .status { padding: 4px 8px; border-radius: 20px; font-size: 10px; font-weight: bold; display: inline-block; }
        .status-recebimento { background: #dcfce7; color: #166534; }
        .status-custo { background: #fee2e2; color: #991b1b; }
        .status-estoque { background: #e0f2fe; color: #0369a1; }
        .status-ativo { background: #f1f5f9; color: #475569; }
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 16px; border-left: 5px solid var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .stat-card h3 { font-size: 12px; color: #64748b; margin-bottom: 5px; }
        .stat-card .value { font-size: 28px; font-weight: 800; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: white; padding: 12px 20px; border-radius: 40px; font-size: 13px; z-index: 9999; animation: fadeOut 3s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
        #loader { position: fixed; top: 0; left: 0; width: 0; height: 3px; background: var(--primary); z-index: 1000; transition: 0.3s; }

            .menu-btn i { margin: 0 auto; }

        .edit-mode input, .edit-mode select { margin: 2px 0; padding: 6px; }

</head>
<body>
<div id="loader"></div>
<aside>
    <div class="brand">CRYO FINANCE</div>

        <button class="menu-btn active" onclick="navTo('view-dash')"><i class="fas fa-chart-line"></i><span> Dashboard</span></button>

</aside>
<main>
    <!-- Dashboard -->
    <section id="view-dash" class="view active">
        <h2>Dashboard Financeiro</h2>
        <div class="card">
            <div class="filters-bar">
                <div><label>Unidade</label><select id="dash-uni"><option value="Todas">Todas</option><option>Santos</option><option>Camaçari</option></select></div>
                <div><label>Início</label><input type="date" id="dash-ini"></div>
                <div><label>Fim</label><input type="date" id="dash-fim"></div>
                <div><button class="btn btn-primary" onclick="atualizarDashboard()"><i class="fas fa-sync"></i> Atualizar</button></div>
            </div>
        </div>
        <div class="dash-grid" id="dash-stats"></div>
        <div class="card"><canvas id="chartDash" height="100"></canvas></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="card"><h3>Resultado: Santos</h3><canvas id="chartSantos" height="150"></canvas></div>
            <div class="card"><h3>Resultado: Camaçari</h3><canvas id="chartCamacari" height="150"></canvas></div>
        </div>
    </section>

    <!-- Plano de Contas -->
    <section id="view-plano" class="view">
        <div style="display:flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <h2>Plano de Contas</h2>
            <button class="btn btn-primary" onclick="seedPlanoCompleto()"><i class="fas fa-database"></i> Carregar Plano Completo</button>
        </div>
        <div class="card">
            <form id="form-conta" class="grid-form" onsubmit="event.preventDefault(); criarConta();">
                <div><label>Código</label><input type="text" id="p-codigo" placeholder="Ex: 3.1.1.01" required></div>
                <div><label>Descrição</label><input type="text" id="p-desc" placeholder="Nome da conta" required></div>
                <div><label>Natureza</label><select id="p-natureza"><option value="recebimento">Recebimento</option><option value="custo">Custo</option><option value="estoque">Estoque</option><option value="ativo">Ativo</option></select></div>
                <div><button type="submit" class="btn btn-primary">Adicionar Conta</button></div>
            </form>
        </div>
        <div class="card"><div class="table-responsive"><table id="tabela-contas"><thead><tr><th>Código</th><th>Descrição</th><th>Natureza</th><th>Ações</th></tr></thead><tbody id="lista-contas"></tbody></table></div></div>
    </section>

    <!-- Lançamentos -->
    <section id="view-lan" class="view">
        <h2>Lançamentos</h2>
        <div class="card">
            <form id="form-lan" class="grid-form" onsubmit="event.preventDefault(); criarLan();">
                <div><label>Data</label><input type="date" id="l-data" required></div>
                <div><label>Unidade</label><select id="l-uni"><option>Santos</option><option>Camaçari</option></select></div>
                <div><label>Conta</label><select id="l-conta" required></select></div>
                <div><label>Descrição</label><input type="text" id="l-desc" required></div>
                <div><label>Valor R$</label><input type="number" step="0.01" id="l-valor" required></div>
                <div><button type="submit" class="btn btn-primary">Salvar Lançamento</button></div>
            </form>
        </div>
        <div class="card">
            <div class="filters-bar">
                <div><label>Data Início</label><input type="date" id="filter-data-ini"></div>
                <div><label>Data Fim</label><input type="date" id="filter-data-fim"></div>
                <div><label>Conta</label><select id="filter-conta"><option value="">Todas</option></select></div>
                <div><button class="btn btn-primary" onclick="carregarLan()"><i class="fas fa-search"></i> Filtrar</button></div>
            </div>
            <h3>Movimentações</h3>
            <div class="table-responsive"><table id="tab-lan"><thead><tr><th>Data</th><th>Unidade</th><th>Conta</th><th>Descrição</th><th>Valor</th><th>Ações</th></tr></thead><tbody></tbody></table></div>
        </div>
    </section>

        <div class="card"><canvas id="chartDRE" height="180"></canvas></div>
    </section>
</main>

// ==================== FUNÇÕES AUXILIARES ====================
function showToast(msg, isError = false) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.background = isError ? '#b91c1c' : '#0f2419';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}
function updateLoader(w) { document.getElementById('loader').style.width = w + '%'; }
function navTo(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.currentTarget.classList.add('active');
    if (id === 'view-dash') atualizarDashboard();
    if (id === 'view-lan') { carregarLan(); carregarFiltroContas(); }
    if (id === 'view-plano') carregarContas();
}

// ==================== PLANO DE CONTAS ====================
async function carregarContas() {
    try {
        if (useAppwrite) {
            const res = await db.listDocuments(DB_ID, COLL_ACC, [Query.limit(500)]);
            cacheAcc = res.documents;
            if (cacheAcc.length === 0) await seedPlanoCompleto();
        } else {
            cacheAcc = localAccounts;
            if (cacheAcc.length === 0) await seedPlanoCompleto();
        }
        renderListaContas();
        popularSelectContas();
    } catch (err) {
        console.warn("Appwrite falhou, usando localStorage", err);
        useAppwrite = false;
        await carregarContas();
    }
}

    tbody.innerHTML = cacheAcc.map(acc => `
        <tr>
            <td>${acc.code}</td>
            <td>${acc.description}</td>
            <td><span class="status status-${acc.nature}">${acc.nature}</span></td>
            <td>
                <button class="btn btn-warning btn-sm" onclick="editarConta('${acc.$id}')"><i class="fas fa-edit"></i></button>
                <button class="btn btn-danger btn-sm" onclick="excluirConta('${acc.$id}', '${acc.code}')"><i class="fas fa-trash"></i></button>
            </td>
        </tr>
    `).join('');
}
function popularSelectContas() {
    const select = document.getElementById('l-conta');
    select.innerHTML = cacheAcc.map(acc => `<option value="${acc.code}">${acc.code} - ${acc.description}</option>`).join('');
}
async function criarConta() {
    const code = document.getElementById('p-codigo').value.trim();
    const desc = document.getElementById('p-desc').value.trim();
    const nature = document.getElementById('p-natureza').value;
    if (!code || !desc) { showToast("Preencha código e descrição", true); return; }
    if (useAppwrite) {
        await db.createDocument(DB_ID, COLL_ACC, ID.unique(), { code, description: desc, nature });
    } else {
        localAccounts.push({ $id: Date.now().toString(), code, description: desc, nature });
        localStorage.setItem('cryo_accounts', JSON.stringify(localAccounts));
    }
    showToast("Conta criada");
    document.getElementById('form-conta').reset();
    await carregarContas();
}
async function seedPlanoCompleto() {
    if (!confirm("Isso irá inserir o plano de contas completo (mais de 100 contas). Continuar?")) return;
    updateLoader(20);
    for (const item of PLANO_COMPLETO) {
        if (useAppwrite) {
            const exists = cacheAcc.some(a => a.code === item.code);
            if (!exists) await db.createDocument(DB_ID, COLL_ACC, ID.unique(), { code: item.code, description: item.desc, nature: item.nature });
        } else {
            if (!localAccounts.some(a => a.code === item.code))
                localAccounts.push({ $id: Date.now().toString(), code: item.code, description: item.desc, nature: item.nature });
        }
    }
    if (!useAppwrite) localStorage.setItem('cryo_accounts', JSON.stringify(localAccounts));
    await carregarContas();
    showToast("Plano de contas completo carregado!");
    updateLoader(100);
}
async function excluirConta(id, code) {
    if (!confirm(`Excluir conta ${code}?`)) return;
    if (useAppwrite) {
        const movs = await db.listDocuments(DB_ID, COLL_MOV, [Query.equal('cat', code), Query.limit(1)]);
        if (movs.total > 0) { showToast("Conta possui lançamentos", true); return; }
        await db.deleteDocument(DB_ID, COLL_ACC, id);
    } else {
        if (localTransactions.some(t => t.cat === code)) { showToast("Conta com lançamentos", true); return; }
        localAccounts = localAccounts.filter(a => a.$id !== id);
        localStorage.setItem('cryo_accounts', JSON.stringify(localAccounts));
    }
    await carregarContas();
    showToast("Conta excluída");
}
function editarConta(id) {
    const conta = cacheAcc.find(a => a.$id === id);
    if (!conta) return;
    const novoCode = prompt("Novo código:", conta.code);
    const novoDesc = prompt("Nova descrição:", conta.description);
    const novaNature = prompt("Nova natureza (recebimento/custo/estoque/ativo):", conta.nature);
    if (novoCode && novoDesc && novaNature) {
        if (useAppwrite) {
            db.updateDocument(DB_ID, COLL_ACC, id, { code: novoCode, description: novoDesc, nature: novaNature }).then(() => carregarContas());
        } else {
            const index = localAccounts.findIndex(a => a.$id === id);
            if (index !== -1) {
                localAccounts[index] = { ...localAccounts[index], code: novoCode, description: novoDesc, nature: novaNature };
                localStorage.setItem('cryo_accounts', JSON.stringify(localAccounts));
                carregarContas();
            }
        }
        showToast("Conta atualizada");
    }
}

// ==================== LANÇAMENTOS ====================
async function criarLan() {
    const codConta = document.getElementById('l-conta').value;
    const conta = cacheAcc.find(a => a.code === codConta);
    if (!conta) { showToast("Conta inválida", true); return; }
    const payload = {
        data: document.getElementById('l-data').value,
        desc: document.getElementById('l-desc').value,
        tipo: conta.nature,
        cat: conta.code,
        nomecat: conta.description,
        cod: conta.code,
        descricao: document.getElementById('l-desc').value,
        valor: parseFloat(document.getElementById('l-valor').value),
        unidade: document.getElementById('l-uni').value,
        contaDebito: (conta.nature === 'recebimento') ? conta.code : '',
        contaCredito: (conta.nature === 'custo') ? conta.code : ''
    };
    if (!payload.data || !payload.desc || isNaN(payload.valor) || payload.valor <= 0) {
        showToast("Preencha todos os campos corretamente", true); return;
    }
    updateLoader(50);
    try {
        if (useAppwrite) await db.createDocument(DB_ID, COLL_MOV, ID.unique(), payload);
        else {
            payload.$id = Date.now().toString();
            localTransactions.unshift(payload);
            localStorage.setItem('cryo_transactions', JSON.stringify(localTransactions));
        }
        showToast("Lançamento salvo");
        document.getElementById('form-lan').reset();
        document.getElementById('l-data').value = new Date().toISOString().split('T')[0];
        await carregarLan();
        atualizarDashboard();
    } catch (err) { showToast("Erro: " + err.message, true); }
    updateLoader(100);
}
async function carregarLan() {
    let transacoes = [];
    if (useAppwrite) {
        const res = await db.listDocuments(DB_ID, COLL_MOV, [Query.orderDesc('data'), Query.limit(500)]);
        transacoes = res.documents;
    } else transacoes = localTransactions;
    // Aplicar filtros
    const ini = document.getElementById('filter-data-ini').value;
    const fim = document.getElementById('filter-data-fim').value;
    const contaFiltro = document.getElementById('filter-conta').value;
    if (ini) transacoes = transacoes.filter(t => t.data >= ini);
    if (fim) transacoes = transacoes.filter(t => t.data <= fim);
    if (contaFiltro) transacoes = transacoes.filter(t => t.cat === contaFiltro);
    const tbody = document.querySelector('#tab-lan tbody');
    tbody.innerHTML = transacoes.map(m => `
        <tr>
            <td>${m.data}</td><td>${m.unidade}</td><td>${m.nomecat}</td><td>${m.desc}</td>
            <td style="color:${m.tipo === 'recebimento' ? 'green' : 'red'}">R$ ${m.valor.toFixed(2)}</td>
            <td>
                <button class="btn btn-warning btn-sm" onclick="editarLan('${m.$id}')"><i class="fas fa-edit"></i></button>
                <button class="btn btn-danger btn-sm" onclick="excluirLan('${m.$id}')"><i class="fas fa-trash"></i></button>
            </td>
        </tr>
    `).join('');
}
async function excluirLan(id) {
    if (!confirm("Excluir lançamento?")) return;
    if (useAppwrite) await db.deleteDocument(DB_ID, COLL_MOV, id);
    else {
        localTransactions = localTransactions.filter(t => t.$id !== id);
        localStorage.setItem('cryo_transactions', JSON.stringify(localTransactions));
    }
    await carregarLan();
    atualizarDashboard();
    showToast("Excluído");
}
function editarLan(id) {
    let transacao;
    if (useAppwrite) {
        // Buscar localmente (já em cache) ou fazer consulta
        transacao = localTransactions.find(t => t.$id === id);
        if (!transacao) { showToast("Edição apenas para localStorage no momento", true); return; }
    } else transacao = localTransactions.find(t => t.$id === id);
    if (!transacao) return;
    const novaData = prompt("Nova data (YYYY-MM-DD):", transacao.data);
    const novaDesc = prompt("Nova descrição:", transacao.desc);
    const novoValor = parseFloat(prompt("Novo valor:", transacao.valor));
    if (novaData && novaDesc && !isNaN(novoValor)) {
        transacao.data = novaData;
        transacao.desc = novaDesc;
        transacao.valor = novoValor;
        if (useAppwrite) db.updateDocument(DB_ID, COLL_MOV, id, { data: novaData, desc: novaDesc, valor: novoValor });
        else localStorage.setItem('cryo_transactions', JSON.stringify(localTransactions));
        carregarLan();
        atualizarDashboard();
        showToast("Lançamento atualizado");
    }
}
function carregarFiltroContas() {
    const select = document.getElementById('filter-conta');
    select.innerHTML = '<option value="">Todas</option>' + cacheAcc.map(acc => `<option value="${acc.code}">${acc.code} - ${acc.description}</option>`).join('');
}

// ==================== DASHBOARD ====================
async function atualizarDashboard() {
    let transacoes = [];
    if (useAppwrite) {
        const res = await db.listDocuments(DB_ID, COLL_MOV, [Query.limit(5000)]);
        transacoes = res.documents;
    } else transacoes = localTransactions;
    const unidadeFiltro = document.getElementById('dash-uni').value;
    const ini = document.getElementById('dash-ini').value || '2000-01-01';
    const fim = document.getElementById('dash-fim').value || '2099-12-31';
    let totals = { Santos: { r:0, c:0 }, Camaçari: { r:0, c:0 }, Geral: { r:0, c:0 } };
    transacoes.forEach(t => {
        if (t.data < ini || t.data > fim) return;
        if (unidadeFiltro !== 'Todas' && t.unidade !== unidadeFiltro) return;
        const nature = t.tipo;
        const unidade = t.unidade || 'Santos';
        if (nature === 'recebimento') {
            totals[unidade].r += t.valor;
            totals.Geral.r += t.valor;
        } else if (nature === 'custo' || nature === 'estoque') {
            totals[unidade].c += t.valor;
            totals.Geral.c += t.valor;
        }
    });
    let exibeR = (unidadeFiltro === 'Todas') ? totals.Geral.r : totals[unidadeFiltro]?.r || 0;
    let exibeC = (unidadeFiltro === 'Todas') ? totals.Geral.c : totals[unidadeFiltro]?.c || 0;
    document.getElementById('dash-stats').innerHTML = `
        <div class="stat-card"><h3>Receitas</h3><div class="value">R$ ${exibeR.toFixed(2)}</div></div>
        <div class="stat-card"><h3>Despesas</h3><div class="value">R$ ${exibeC.toFixed(2)}</div></div>
        <div class="stat-card"><h3>Resultado</h3><div class="value">R$ ${(exibeR - exibeC).toFixed(2)}</div></div>
    `;
    const ctxGeral = document.getElementById('chartDash').getContext('2d');
    if (chartDash) chartDash.destroy();
    chartDash = new Chart(ctxGeral, {
        type: 'bar',
        data: { labels: ['Receitas', 'Despesas'], datasets: [{ label: 'Valores', data: [totals.Geral.r, totals.Geral.c], backgroundColor: ['#22c55e', '#ef4444'], borderRadius: 8 }] }
    });
    // Gráficos por unidade
    const ctxSantos = document.getElementById('chartSantos').getContext('2d');
    if (chartSantos) chartSantos.destroy();
    chartSantos = new Chart(ctxSantos, { type: 'bar', data: { labels: ['Receita', 'Despesa'], datasets: [{ data: [totals.Santos.r, totals.Santos.c], backgroundColor: ['#22c55e','#ef4444'] }] } });
    const ctxCam = document.getElementById('chartCamacari').getContext('2d');
    if (chartCamacari) chartCamacari.destroy();
    chartCamacari = new Chart(ctxCam, { type: 'bar', data: { labels: ['Receita', 'Despesa'], datasets: [{ data: [totals.Camaçari.r, totals.Camaçari.c], backgroundColor: ['#22c55e','#ef4444'] }] } });
}

// ==================== DRE ====================
async function gerarDRE() {
    let transacoes = [];
    if (useAppwrite) {
        const res = await db.listDocuments(DB_ID, COLL_MOV, [Query.limit(5000)]);
        transacoes = res.documents;
    } else transacoes = localTransactions;
    const uni = document.getElementById('dre-uni').value;
    const ini = document.getElementById('dre-ini').value || '2000-01-01';
    const fim = document.getElementById('dre-fim').value || '2099-12-31';
    let receitas = 0, custos = 0, grupos = {};
    for (let t of transacoes) {
        if (t.data < ini || t.data > fim) continue;
        if (uni !== 'Todas' && t.unidade !== uni) continue;
        if (t.tipo === 'recebimento') receitas += t.valor;
        else if (t.tipo === 'custo' || t.tipo === 'estoque') custos += t.valor;
        if (!grupos[t.cat]) grupos[t.cat] = { desc: t.nomecat, valor: 0, tipo: t.tipo };
        grupos[t.cat].valor += t.valor;
    }
    let html = `<tr style="background:#f1f5f9; font-weight:bold"><td>(+) RECEITAS OPERACIONAIS</td><td>---</td></tr>`;
    for (let g of Object.values(grupos)) if (g.tipo === 'recebimento') html += `<tr><td style="padding-left:20px">${g.desc}</td><td>R$ ${g.valor.toFixed(2)}</td></tr>`;
    html += `<tr style="background:#f1f5f9; font-weight:bold"><td>(-) CUSTOS E ESTOQUES</td><td>---</td></tr>`;
    for (let g of Object.values(grupos)) if (g.tipo === 'custo' || g.tipo === 'estoque') html += `<tr><td style="padding-left:20px">${g.desc}</td><td style="color:var(--danger)">R$ ${g.valor.toFixed(2)}</td></tr>`;
    html += `<tr style="background:var(--dark); color:white; font-weight:bold"><td>RESULTADO DO EXERCÍCIO</td><td>R$ ${(receitas - custos).toFixed(2)}</td></tr>`;
    document.getElementById('dre-corpo').innerHTML = html;
    if (chartDRE) chartDRE.destroy();
    chartDRE = new Chart(document.getElementById('chartDRE'), {
        type: 'doughnut',
        data: { labels: ['Receitas', 'Custos/Estoque'], datasets: [{ data: [receitas, custos], backgroundColor: ['#22c55e', '#ef4444'] }] }
    });
}

// ==================== INICIALIZAÇÃO ====================
async function init() {
    setDatasPadrao();
    await carregarContas();
    await carregarLan();
    await atualizarDashboard();
}
function setDatasPadrao() {
    const hoje = new Date().toISOString().split('T')[0];
    const primeiroDia = hoje.substring(0,8)+'01';
    ['l-data', 'dash-ini', 'dre-ini', 'filter-data-ini'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = primeiroDia; });
    ['dash-fim', 'dre-fim', 'filter-data-fim'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = hoje; });
}
init();
</script>
